plugins {
    id 'com.android.application'
}
android {
    namespace "com.yourname.aeroengine"
    compileSdk 34
    ndkVersion "25.2.9519653"
    defaultConfig {
        applicationId "com.yourname.aeroengine"
        minSdk 24
        targetSdk 34
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared",
                          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    // Point to your assets folder
    sourceSets {
        main {
            assets.srcDirs = ['../../android/app/src/main/assets']
        }
    }
}
